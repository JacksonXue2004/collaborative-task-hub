name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: Type check and tests
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the test suite; the credentials are test-only placeholders.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_hub_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/task_hub_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
